[project]
name = "agents-everywhere"
version = "0.1.0"
description = "A context-aware AI delegate for meetings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=45.0.0",
    "elevenlabs>=2.68.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "openai>=1.100.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
